<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats | GearTask Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../Css/EstiloBase.css">
    <link rel="stylesheet" href="../Css/EstiloAreaTrabajo.css">
    <link rel="stylesheet" href="../Css/EstiloFormulario.css">
    <link rel="stylesheet" href="../Css/EstiloChats.css">
</head>
<body>

  <div class="app-shell">

    <!-- SIDEBAR DE CHATS -->
    <aside class="sidebar sidebar-chats">

        <div class="p-3 border-bottom border-secondary position-relative z-2 mt-4">
            <h5 class="mb-3 fw-bold text-white"><i class="bi bi-chat-dots-fill me-2"></i>Chats</h5>

            <div class="input-group mb-2">
                <span class="input-group-text auth-input border-end-0"><i class="bi bi-person text-white-50"></i></span>
                <input type="text" class="form-control auth-input border-start-0 ps-0 search-chat" id="buscarUsuarioChat" placeholder="Buscar por usuario...">
            </div>

            <div class="input-group">
                <span class="input-group-text auth-input border-end-0"><i class="bi bi-telephone text-white-50"></i></span>
                <input type="text" class="form-control auth-input border-start-0 ps-0 search-chat" id="buscarTelefonoChat" placeholder="Buscar por teléfono..." inputmode="numeric" maxlength="10">
            </div>
            <small class="text-warning d-block mt-2 d-none" id="mensajeBusquedaChat"></small>
        </div>

        <!-- LISTA DE CHATS -->
        <div class="chat-list overflow-auto flex-grow-1 position-relative z-2" id="listaChats"></div>

        <div class="sidebar-footer">
            <div class="sidebar-footer-row">
                <i class="bi bi-gear-fill sidebar-footer-gear"></i>
                <a href="AreaTrabajo.html" class="btn btn-outline-light btn-glow btn-glow-danger rounded-pill sidebar-footer-btn d-flex align-items-center justify-content-center gap-2 w-100">
                    <i class="bi bi-arrow-left"></i>
                    <span class="footer-btn-text">Volver</span>
                </a>
            </div>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL DEL CHAT -->
    <main class="main-content chat-main d-flex flex-column p-0">

        <header class="chat-header d-flex align-items-center p-3 d-none" id="encabezadoChat">
            <img src="../Assets/perfil.jpg" alt="Perfil" class="chat-avatar me-3" id="fotoChat">
            <div>
                <h5 class="mb-0 text-white fw-bold" id="nombreChat"></h5>
                <small class="text-white-50" id="rolChat"></small>
            </div>
        </header>

        <div class="chat-history flex-grow-1 p-4 overflow-auto" id="historialChat">
            <p class="text-white-50 text-center mt-5" id="chatVacio">Busca a un integrante o elige un chat para empezar a conversar.</p>
        </div>

        <footer class="chat-input-area p-3">
            <form class="d-flex gap-2 m-0" id="formChat">
                <input type="text" class="form-control auth-input flex-grow-1 rounded-pill px-4" id="inputMensaje" placeholder="Escribe un mensaje..." maxlength="1000" autocomplete="off" disabled>
                <button type="submit" class="btn btn-outline-light btn-glow rounded-circle d-flex align-items-center justify-content-center" id="btnEnviarMensaje" style="width: 48px; height: 48px; flex-shrink: 0;" disabled>
                    <i class="bi bi-send-fill"></i>
                </button>
            </form>
        </footer>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../Js/Pantallas.js"></script>
  <script src="../Js/api.js"></script>
  <script src="../Js/chats.js"></script>
</body>
</html>
