<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats | GearTask Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../Css/EstiloBase.css">
    <link rel="stylesheet" href="../Css/EstiloAreaTrabajo.css"> 
    <link rel="stylesheet" href="../Css/EstiloFormulario.css">
    <link rel="stylesheet" href="../Css/EstiloChats.css"> 
</head>
<body>

  <div class="app-shell">
    
    <!-- SIDEBAR DE CHATS -->
    <aside class="sidebar sidebar-chats">
        
        <div class="p-3 border-bottom border-secondary position-relative z-2 mt-4">
            <h5 class="mb-3 fw-bold text-white"><i class="bi bi-chat-dots-fill me-2"></i>Chats</h5>
            
            <div class="input-group mb-2">
                <span class="input-group-text auth-input border-end-0"><i class="bi bi-person text-white-50"></i></span>
                <input type="text" class="form-control auth-input border-start-0 ps-0 search-chat" placeholder="Buscar por usuario...">
            </div>
            
            <div class="input-group">
                <span class="input-group-text auth-input border-end-0"><i class="bi bi-telephone text-white-50"></i></span>
                <input type="text" class="form-control auth-input border-start-0 ps-0 search-chat" placeholder="Buscar por teléfono...">
            </div>
        </div>

        <!-- LISTA DE CHATS -->
        <div class="chat-list overflow-auto flex-grow-1 position-relative z-2">
            <!-- Chat de ejemplo -->
            <div class="chat-item d-flex align-items-center p-3 active">
                <img src="../Assets/perfil.jpg" alt="Perfil" class="chat-avatar me-3">
                <div class="chat-item-info overflow-hidden">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <span class="fw-semibold text-white text-truncate">Ejemplo_01</span>
                        <small class="chat-item-time">10:38 AM</small>
                    </div>
                    <p class="chat-item-preview mb-0 text-truncate small">¡Sí! Ya lo subi a github.</p>
                </div>
            </div>
        </div>

        <div class="sidebar-footer">
            <div class="sidebar-footer-row">
                <i class="bi bi-gear-fill sidebar-footer-gear"></i>
                <a href="AreaTrabajo.html" class="btn btn-outline-light btn-glow btn-glow-danger rounded-pill sidebar-footer-btn d-flex align-items-center justify-content-center gap-2 w-100">
                    <i class="bi bi-arrow-left"></i>
                    <span class="footer-btn-text">Volver</span>
                </a>
            </div>
        </div>
    </aside>

    <!-- ÁREA PRINCIPAL DEL CHAT -->
    <main class="main-content chat-main d-flex flex-column p-0">
        
        <header class="chat-header d-flex align-items-center p-3">
            <img src="../Assets/perfil.jpg" alt="Perfil" class="chat-avatar me-3">
            <div>
                <h5 class="mb-0 text-white fw-bold">Ejemplo_01</h5>
                <small class="text-success"><i class="bi bi-circle-fill me-1" style="font-size: 0.5rem;"></i>En línea</small>
            </div>
        </header>

        <div class="chat-history flex-grow-1 p-4 overflow-auto">
            
            <div class="message received mb-3 d-flex flex-column align-items-start">
                <div class="message-bubble p-3 rounded-3 shadow-sm">
                    ¿Ya quedó listo el frontend??
                </div>
                <small class="message-time mt-1">10:35 AM</small>
            </div>

            <div class="message sent mb-3 d-flex flex-column align-items-end">
                <div class="message-bubble p-3 rounded-3 shadow-sm">
                    ¡Sí! Ya lo subi a github.
                </div>
                <small class="message-time mt-1">10:38 AM</small>
            </div>

        </div>

        <footer class="chat-input-area p-3">
            <form class="d-flex gap-2 m-0" id="formChat">
                <input type="text" class="form-control auth-input flex-grow-1 rounded-pill px-4" placeholder="Escribe un mensaje...">
                <button type="submit" class="btn btn-outline-light btn-glow rounded-circle d-flex align-items-center justify-content-center" style="width: 48px; height: 48px; flex-shrink: 0;">
                    <i class="bi bi-send-fill"></i>
                </button>
            </form>
        </footer>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../Js/Pantallas.js"></script>
</body>
</html>
