<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registrarse | GearTask Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../Css/EstiloBase.css">
  <link rel="stylesheet" href="../Css/Cargando.css">
  <!-- CSS compartido solo entre login y registro -->
  <link rel="stylesheet" href="../Css/EstiloFormulario.css">
</head>

<body>

  <div id="page-loader" class="page-loader">
    <i class="bi bi-gear-fill loader-gear"></i>
  </div>

  <section class="hero-section d-flex align-items-center justify-content-center py-5">

    <div class="hero-bg-image"></div>
    <div class="hero-bg-overlay"></div>

    <i class="bi bi-gear-fill gear" style="--size:7rem; --top:-2rem; --left:-2rem; --duration:22s;"></i>
    <i class="bi bi-gear-fill gear" style="--size:4rem; --bottom:5%; --right:6%; --duration:16s; --dir:reverse;"></i>

    <div class="container position-relative" style="z-index: 5;">
      <div class="row justify-content-center">
        <div class="col-11 col-sm-9 col-md-7 col-lg-5">
          <div class="auth-card p-4 p-md-5">

            <div class="text-center mb-4">
              <i class="bi bi-gear-fill auth-icon"></i>
              <h2 class="auth-title mt-2">Crear Cuenta</h2>
            </div>

            <form id="formRegistro">
              <!-- Aquí se muestran los errores que devuelve el servidor -->
              <div id="registroError" class="alert alert-danger py-2 small d-none" role="alert"></div>

              <div class="mb-3 text-center">
                <label for="regFoto" class="form-label d-block">Foto de perfil</label>
                <input type="file" class="form-control auth-input" id="regFoto" accept="image/*">
              </div>

              <div class="mb-3">
                <label for="regNombre" class="form-label">Nombre completo</label>
                <input type="text" class="form-control auth-input" id="regNombre" placeholder="Nombre y apellidos" required minlength="3" maxlength="80" autocomplete="name">
              </div>

              <div class="mb-3">
                <label for="regUsuario" class="form-label">Nombre de usuario</label>
                <input type="text" class="form-control auth-input" id="regUsuario" placeholder="usuario único" required minlength="3" maxlength="30" autocomplete="username">
              </div>

              <div class="mb-3">
                <label for="regCorreo" class="form-label">Correo</label>
                <input type="email" class="form-control auth-input" id="regCorreo" placeholder="correo@ejemplo.com" required autocomplete="email">
              </div>

              <div class="mb-3">
                <label for="regPass" class="form-label">Contraseña</label>
                <div class="input-group auth-input-group">
                  <input type="password" class="form-control auth-input" id="regPass" placeholder="••••••••" required minlength="6" maxlength="72" autocomplete="new-password">
                  <button class="btn auth-toggle-pass" type="button" data-target="regPass" aria-label="Mostrar u ocultar contraseña">
                    <i class="bi bi-eye-fill"></i>
                  </button>
                </div>
              </div>

              <div class="mb-3">
                <label for="regTelefono" class="form-label">Número de teléfono</label>
                <input type="tel" class="form-control auth-input" id="regTelefono" placeholder="10 dígitos" required inputmode="numeric" maxlength="10" autocomplete="tel">
              </div>

              <div class="mb-4">
                <label for="regRol" class="form-label">Rol / Experiencia</label>
                <select class="form-select auth-input" id="regRol">
                  <option selected>Sin experiencia previa</option>
                  <option>Programador Frontend</option>
                  <option>Programador Backend</option>
                  <option>Programador Fullstack</option>
                  <option>Documentador</option>
                  <option>Diseñador</option>
                  <option>Editor</option>
                  <option>Software Engineer</option>
                  <option>Data Engineer</option>
                </select>
              </div>

              <button type="submit" class="btn btn-outline-light btn-glow rounded-pill w-100 py-2">Registrarse</button>
            </form>

            <p class="text-center small mt-4 mb-0">
              ¿Ya tienes cuenta? <a href="login.html" class="auth-link fw-semibold">Inicia sesión</a>
            </p>
          </div>
        </div>
      </div>
    </div>

  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../Js/Pantallas.js"></script>
  <script src="../Js/api.js"></script>
  <script src="../Js/registro.js"></script>
</body>
</html>
