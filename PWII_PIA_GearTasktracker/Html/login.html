<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión | GearTask Tracker</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <link rel="stylesheet" href="../Css/EstiloBase.css">
  <link rel="stylesheet" href="../Css/Cargando.css">
  <!-- CSS compartido solo entre login y registro -->
  <link rel="stylesheet" href="../Css/EstiloFormulario.css">
</head>

<body>

  <div id="page-loader" class="page-loader">
    <i class="bi bi-gear-fill loader-gear"></i>
  </div>

  <section class="hero-section d-flex align-items-center justify-content-center py-5">

    <div class="hero-bg-image"></div>
    <div class="hero-bg-overlay"></div>

    <i class="bi bi-gear-fill gear" style="--size:7rem; --top:-2rem; --right:-2rem; --duration:22s;"></i>
    <i class="bi bi-gear-fill gear" style="--size:4rem; --bottom:5%; --left:6%; --duration:16s; --dir:reverse;"></i>

    <div class="container position-relative " style="z-index: 5;">
      <div class="row justify-content-center">
        <div class="col-11 col-sm-8 col-md-6 col-lg-4">
          <div class="auth-card p-4 p-md-5">

            <div class="text-center mb-4">
              <i class="bi bi-gear-fill auth-icon"></i>
              <h2 class="auth-title mt-2">Iniciar Sesión</h2>
            </div>

            <form id="formLogin">
              <!-- Aquí se muestran los errores que devuelve el servidor -->
              <div id="loginError" class="alert alert-danger py-2 small d-none" role="alert"></div>

              <div class="mb-3">
                <label for="loginCorreo" class="form-label">Correo</label>
                <input type="email" class="form-control auth-input" id="loginCorreo" placeholder="correo@ejemplo.com" required autocomplete="email">
              </div>

              <div class="mb-4">
                <label for="loginPass" class="form-label">Contraseña</label>
                <div class="input-group auth-input-group">
                  <input type="password" class="form-control auth-input" id="loginPass" placeholder="••••••••" required autocomplete="current-password">
                  <button class="btn auth-toggle-pass" type="button" data-target="loginPass" aria-label="Mostrar u ocultar contraseña">
                    <i class="bi bi-eye-fill"></i>
                  </button>
                </div>
              </div>

              <button type="submit" class="btn btn-outline-light btn-glow rounded-pill w-100 py-2">Iniciar Sesión</button>
            </form>

            <p class="text-center small mt-4 mb-0">
              ¿No tienes cuenta? <a href="registro.html" class="auth-link fw-semibold">Regístrate</a>
            </p>
          </div>
        </div>
      </div>
    </div>

  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../Js/Pantallas.js"></script>
  <script src="../Js/api.js"></script>
  <script src="../Js/login.js"></script>
</body>
</html>
