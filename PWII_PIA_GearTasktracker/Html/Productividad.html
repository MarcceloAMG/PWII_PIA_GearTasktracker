<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Productividad | GearTask Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../Css/EstiloBase.css">
    <link rel="stylesheet" href="../Css/EstiloAreaTrabajo.css">
    <link rel="stylesheet" href="../Css/EstiloFormulario.css">
    <link rel="stylesheet" href="../Css/EstiloProductividad.css">
</head>

<body>

  <div class="app-shell">

    <div class="content-column flex-grow-1">

      <header class="topbar">
        <div class="topbar-icons">
          <button type="button" class="topbar-icon-btn" data-bs-toggle="modal" data-bs-target="#modalVersion"
                  data-bs-placement="bottom" title="Cambiar entre versión básica y premium">
            <i class="bi bi-gem"></i>
          </button>
        </div>
      </header>

      <main class="main-content d-flex flex-column p-4 position-relative">

        <div class="d-flex align-items-center justify-content-between mb-3 z-2">
          <div>
            <h3 class="fw-bold text-dark mb-0" id="tituloMes">Métricas de Productividad</h3>
            <small class="text-muted" id="subtituloPlan">Plan Actual: <span class="badge bg-secondary" id="badgePlan">Básico</span></small>
          </div>
        </div>

        <div class="chart-wrapper rounded-4 p-4 shadow-sm z-2 flex-grow-1 d-flex flex-column justify-content-center">

          <!-- Vista gráfica: tareas completadas por día (las barras se generan con los datos del servidor) -->
          <div id="vistaGrafica" class="chart-scroll-container">
            <p class="text-white-50 small mb-3" id="resumenMes"></p>
            <div class="chart-bars-mock d-flex align-items-end gap-3 pb-3" id="contenedorDias"></div>
          </div>

          <!-- Vista vacía (mes sin tareas completadas) -->
          <div id="vistaVacia" class="chart-empty-state d-none text-center p-5">
            <i class="bi bi-bar-chart-line fs-1 text-white-50 mb-3"></i>
            <h5 class="text-white">Sin tareas completadas en este mes</h5>
            <p class="text-white-50 mb-0 small">Cuando completes tareas aparecerán aquí.</p>
          </div>
        </div>

      </main>

    </div>

    <!-- SIDEBAR DERECHA: SELECCIÓN DE MESES -->
    <aside class="sidebar sidebar-months border-start border-secondary">

      <div class="p-3 border-bottom border-secondary">
        <h5 class="mb-0 fw-bold text-white"><i class="bi bi-calendar3 me-2"></i>Productividad</h5>
      </div>

      <div class="months-list overflow-auto flex-grow-1 p-2" id="listaMeses"></div>

      <div class="sidebar-footer">
        <div class="sidebar-footer-row">
          <i class="bi bi-gear-fill sidebar-footer-gear"></i>
          <a href="AreaTrabajo.html" class="btn btn-outline-light btn-glow btn-glow-danger rounded-pill sidebar-footer-btn d-flex align-items-center justify-content-center gap-2 w-100">
            <i class="bi bi-arrow-left"></i>
            <span class="footer-btn-text">Volver</span>
          </a>
        </div>
      </div>

    </aside>

  </div>

  <!-- MODAL DE SUSCRIPCIÓN (REUTILIZADO DE AreaTrabajo.html) -->
  <div class="modal fade" id="modalVersion" tabindex="-1" aria-labelledby="modalVersionLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content ajustes-modal-content">

        <i class="bi bi-gear-fill gear ajustes-modal-gear" style="--size:14rem; --top:-4rem; --right:-4rem; --duration:30s;"></i>

        <div class="modal-header border-0">
          <h5 class="modal-title" id="modalVersionLabel"><i class="bi bi-gem me-2"></i>Plan de la cuenta</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>

        <div class="modal-body">
          <div class="version-card mb-4">
            <div class="version-card-row">
              <span>•••• •••• •••• 4242</span>
              <i class="bi bi-credit-card-2-front-fill"></i>
            </div>
            <div class="version-card-row version-card-small">
              <span>NOMBRE DEL TITULAR</span>
              <span>MM/AA</span>
            </div>
          </div>

          <div class="d-flex align-items-center justify-content-between version-switch-row">
            <span>Básica</span>
            <div class="form-check form-switch mb-0">
              <input class="form-check-input" type="checkbox" role="switch" id="switchVersion">
            </div>
            <span>Premium</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../Js/Pantallas.js"></script>
  <script src="../Js/api.js"></script>
  <script src="../Js/Productividad.js"></script>
</body>
</html>
