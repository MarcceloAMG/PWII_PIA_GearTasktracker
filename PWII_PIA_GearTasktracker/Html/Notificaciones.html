<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notificaciones | GearTask Tracker</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

    <link rel="stylesheet" href="../Css/EstiloBase.css">
    <link rel="stylesheet" href="../Css/EstiloAreaTrabajo.css">
    <link rel="stylesheet" href="../Css/EstiloNotificaciones.css">
</head>
<body>

  <div class="notif-screen position-relative min-vh-100 overflow-hidden d-flex flex-column">

    <i class="bi bi-gear-fill gear main-content-gear" style="--size:26rem; --bottom:-13rem; --right:-13rem; --duration:35s;"></i>

    <main class="container py-5 flex-grow-1 position-relative z-2" style="max-width: 800px;">

      <div class="d-flex align-items-center justify-content-between mb-4 pb-2 border-bottom border-secondary">
        <div class="d-flex align-items-center">
          <i class="bi bi-bell-fill fs-2 text-dark me-3"></i>
          <h2 class="fw-bold m-0 text-dark">Centro de Notificaciones</h2>
        </div>
        <button type="button" class="btn btn-dark rounded-pill btn-sm px-3" id="btnMarcarTodas">
          <i class="bi bi-check2-all me-1"></i>Marcar todas como leídas
        </button>
      </div>

      <div class="d-flex flex-column gap-3" id="listaNotificaciones">
        <p class="text-dark">Cargando notificaciones...</p>
      </div>

    </main>

    <div class="notif-back-btn position-fixed bottom-0 start-0 m-4 z-3">
      <a href="AreaTrabajo.html" class="btn btn-outline-light btn-glow btn-glow-danger rounded-pill px-4 py-2 d-flex align-items-center gap-2 shadow">
        <i class="bi bi-arrow-left fs-5"></i>
        <span class="fw-semibold">Volver</span>
      </a>
    </div>

  </div>

  <!-- MODAL DE DETALLE (se reutiliza para cada tipo de notificación) -->
  <div class="modal fade" id="modalNotif" tabindex="-1" aria-labelledby="modalNotifLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content notif-modal-content border-0 shadow-lg">
        <div class="modal-header border-bottom border-dark border-opacity-25">
          <h5 class="modal-title fw-bold text-dark" id="modalNotifLabel">
            <i class="bi bi-bell-fill me-2"></i><span id="tituloModalNotif"></span>
          </h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body text-dark">
          <div class="d-flex align-items-center gap-3 mb-3">
            <img src="../Assets/perfil.jpg" alt="Foto perfil" class="notif-avatar-modal" id="avatarModalNotif">
            <div>
              <h6 class="mb-0 fw-bold" id="nombreModalNotif"></h6>
              <small class="text-muted" id="detalleModalNotif"></small>
            </div>
          </div>
          <p class="mb-0" id="textoModalNotif"></p>
        </div>
        <div class="modal-footer border-0">
          <button type="button" class="btn btn-dark rounded-pill px-4" data-bs-dismiss="modal">Entendido</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../Js/Pantallas.js"></script>
  <script src="../Js/api.js"></script>
  <script src="../Js/Notificaciones.js"></script>
</body>
</html>
